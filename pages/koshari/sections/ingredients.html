<!-- Ingredients and servings -->
<section class="recipe-section">
  <h2>Ingredients</h2>
  <div class="servings-control">
    <span class="servings-label">Servings</span>
    <button
      type="button"
      class="servings-button"
      data-servings-step="-1"
      aria-label="Decrease servings">&minus;</button>
    <output class="servings-count" aria-live="polite">4</output>
    <button
      type="button"
      class="servings-button"
      data-servings-step="1"
      aria-label="Increase servings">+</button>
  </div>
  <ul class="ingredient-list">
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> cup brown lentils</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> cup short-grain rice</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> cup small macaroni</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> can chickpeas</li>
    <li class="ingredient-item"><span class="amount" data-base="4">4</span> ripe tomatoes, crushed</li>
    <li class="ingredient-item"><span class="amount" data-base="2">2</span> tsp ground cumin</li>
    <li class="ingredient-item"><span class="amount" data-base="4">4</span> cloves garlic</li>
    <li class="ingredient-item"><span class="amount" data-base="2">2</span> onions, thinly sliced</li>
  </ul>
</section>
