<!-- Ingredients and servings -->
<section class="recipe-section">
  <h2>Ingredients</h2>
  <div class="servings-control">
    <span class="servings-label">Servings</span>
    <button
      type="button"
      class="servings-button"
      data-servings-step="-1"
      aria-label="Decrease servings">&minus;</button>
    <output class="servings-count" aria-live="polite">4</output>
    <button
      type="button"
      class="servings-button"
      data-servings-step="1"
      aria-label="Increase servings">+</button>
  </div>
  <ul class="ingredient-list">
    <li class="ingredient-item"><span class="amount" data-base="2">2</span> cups long-grain parboiled rice</li>
    <li class="ingredient-item"><span class="amount" data-base="4">4</span> ripe tomatoes, blended</li>
    <li class="ingredient-item"><span class="amount" data-base="2">2</span> red bell peppers</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> scotch bonnet</li>
    <li class="ingredient-item"><span class="amount" data-base="2">2</span> tbsp tomato paste</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> tsp dried thyme</li>
    <li class="ingredient-item"><span class="amount" data-base="2">2</span> tsp curry powder</li>
    <li class="ingredient-item"><span class="amount" data-base="3">3</span> cups chicken stock</li>
  </ul>
</section>
