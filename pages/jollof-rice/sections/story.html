    Born along the Senegal River, jollof is now a pot of friendly rivalry across Ghana,
    Nigeria and Senegal. Nigerian <mark>party jollof</mark> gets its smoky edge from
    slow-cooked rice, <mark>scotch bonnet</mark> heat, <mark>thyme</mark> and a rich
    <mark>tomato</mark> base.
