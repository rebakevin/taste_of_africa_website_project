<!-- Ingredients and servings -->
<section class="recipe-section">
  <h2>Ingredients</h2>
  <div class="servings-control">
    <span class="servings-label">Servings</span>
    <button
      type="button"
      class="servings-button"
      data-servings-step="-1"
      aria-label="Decrease servings">&minus;</button>
    <output class="servings-count" aria-live="polite">4</output>
    <button
      type="button"
      class="servings-button"
      data-servings-step="1"
      aria-label="Increase servings">+</button>
  </div>
  <ul class="ingredient-list">
    <li class="ingredient-item"><span class="amount" data-base="500">500</span> g cassava leaves, pounded</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> eggplant, diced</li>
    <li class="ingredient-item"><span class="amount" data-base="0.5">0.5</span> cup peanut paste</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> onion, chopped</li>
    <li class="ingredient-item"><span class="amount" data-base="3">3</span> cloves garlic</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> handful spinach</li>
    <li class="ingredient-item"><span class="amount" data-base="2">2</span> cups water</li>
  </ul>
</section>
