<!-- Ingredients and servings -->
<section class="recipe-section">
  <h2>Ingredients</h2>
  <div class="servings-control">
    <span class="servings-label">Servings</span>
    <button
      type="button"
      class="servings-button"
      data-servings-step="-1"
      aria-label="Decrease servings">&minus;</button>
    <output class="servings-count" aria-live="polite">4</output>
    <button
      type="button"
      class="servings-button"
      data-servings-step="1"
      aria-label="Increase servings">+</button>
  </div>
  <ul class="ingredient-list">
    <li class="ingredient-item"><span class="amount" data-base="600">600</span> g chicken or lamb, cubed</li>
    <li class="ingredient-item"><span class="amount" data-base="2">2</span> tbsp garam masala</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> tsp turmeric</li>
    <li class="ingredient-item"><span class="amount" data-base="2">2</span> tsp chilli powder</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> tbsp fresh ginger, grated</li>
    <li class="ingredient-item"><span class="amount" data-base="2">2</span> potatoes, cubed</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> can chopped tomatoes</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> white loaf, quartered</li>
  </ul>
</section>
