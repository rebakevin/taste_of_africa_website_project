<!-- Ingredients and servings -->
<section class="recipe-section">
  <h2>Ingredients</h2>
  <div class="servings-control">
    <span class="servings-label">Servings</span>
    <button
      type="button"
      class="servings-button"
      data-servings-step="-1"
      aria-label="Decrease servings">&minus;</button>
    <output class="servings-count" aria-live="polite">4</output>
    <button
      type="button"
      class="servings-button"
      data-servings-step="1"
      aria-label="Increase servings">+</button>
  </div>
  <ul class="ingredient-list">
    <li class="ingredient-item"><span class="amount" data-base="2">2</span> cups teff flour</li>
    <li class="ingredient-item"><span class="amount" data-base="3">3</span> cups water, plus more</li>
    <li class="ingredient-item"><span class="amount" data-base="1">1</span> pinch salt</li>
    <li class="ingredient-item"><span class="amount" data-base="0.25">0.25</span> cup starter from a previous batch</li>
  </ul>
</section>
